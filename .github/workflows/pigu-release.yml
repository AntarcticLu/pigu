name: Pigu Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.0.1)"
        required: true
        default: "v0.0.1"

permissions:
  contents: write
  actions: read

jobs:
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            cli_target: darwin-arm64
          - target: darwin-x64
            cli_target: darwin-x64-baseline
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --os=darwin --cpu=*
      - name: Build CLI
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_TARGET: ${{ matrix.cli_target }}
          BUN_COMPILE_RELEASE: bun-v1.4.4
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export OPENCODE_VERSION="${GITHUB_REF_NAME#v}"
          cd packages/cli
          bun run script/build.ts --skip-web-ui
      - name: Build & Pack Desktop
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_TARGET: ${{ matrix.target }}
        run: |
          export OPENCODE_VERSION="${GITHUB_REF_NAME#v}"
          cd packages/desktop
          bun run build
          bun run pack
      - name: Assemble macOS Release Archive
        run: |
          mkdir -p release-stage/bin
          tar -xf dist/desktop/opencode-desktop-mac-*.app.tar -C release-stage
          app_bundle=$(cd release-stage && ls -d *.app | head -n 1)
          ln -sf "../${app_bundle}/Contents/Resources/opencode-cli" release-stage/bin/opencode
          ln -sf opencode release-stage/bin/pigu
          GZIP=-9 tar -czf pigu-${{ matrix.target }}.tar.gz -C release-stage .
      - uses: actions/upload-artifact@v4
        with:
          name: pigu-${{ matrix.target }}
          path: pigu-${{ matrix.target }}.tar.gz
      - name: Attach macOS Archive to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "Pigu ${{ inputs.tag || github.ref_name }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: pigu-${{ matrix.target }}.tar.gz

  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            cli_target: linux-x64
          - target: linux-arm64
            cli_target: linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install
      - name: Build CLI
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_TARGET: ${{ matrix.cli_target }}
          BUN_COMPILE_RELEASE: bun-v1.4.4
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export OPENCODE_VERSION="${GITHUB_REF_NAME#v}"
          cd packages/cli
          bun run script/build.ts --skip-web-ui
      - name: Assemble Linux Release Archive
        run: |
          mkdir -p release-stage/bin
          cp packages/cli/dist/cli-${{ matrix.cli_target }}/bin/opencode release-stage/bin/opencode
          chmod 755 release-stage/bin/opencode
          ln -sf opencode release-stage/bin/pigu
          GZIP=-9 tar -czf pigu-${{ matrix.target }}.tar.gz -C release-stage .
      - uses: actions/upload-artifact@v4
        with:
          name: pigu-${{ matrix.target }}
          path: pigu-${{ matrix.target }}.tar.gz
      - name: Attach Linux Archive to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "Pigu ${{ inputs.tag || github.ref_name }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: pigu-${{ matrix.target }}.tar.gz

  build-windows:
    name: Build Windows (windows-x64.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install
      - name: Build CLI
        shell: bash
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_TARGET: windows-x64-baseline
          BUN_COMPILE_RELEASE: bun-v1.4.4
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export OPENCODE_VERSION="${GITHUB_REF_NAME#v}"
          cd packages/cli
          bun run script/build.ts --skip-web-ui
      - name: Build & Pack Desktop (Unpacked Portable Dir)
        shell: bash
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_TARGET: windows-x64
        run: |
          export OPENCODE_VERSION="${GITHUB_REF_NAME#v}"
          cd packages/desktop
          bun run build
          bun run pack
      - name: Create Windows Portable ZIP
        shell: pwsh
        run: |
          $binDir = Join-Path $PWD "dist/desktop/app/bin"
          $zipPath = Join-Path $PWD "pigu-windows-x64.zip"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          $cmdShim = "@echo off`r`n`"%~dp0..\resources\opencode-cli.exe`" %*`r`nexit /b %ERRORLEVEL%`r`n"
          $shShim = "#!/bin/sh`nbasedir=`$(CDPATH= cd -- `"`$(dirname -- `"`$0`")`" && pwd)`nexec `"`$basedir/../resources/opencode-cli.exe`" `"`$@`"`n"
          [System.IO.File]::WriteAllText((Join-Path $binDir "pigu.cmd"), $cmdShim, $utf8NoBom)
          [System.IO.File]::WriteAllText((Join-Path $binDir "opencode.cmd"), $cmdShim, $utf8NoBom)
          [System.IO.File]::WriteAllText((Join-Path $binDir "pigu"), $shShim, $utf8NoBom)
          [System.IO.File]::WriteAllText((Join-Path $binDir "opencode"), $shShim, $utf8NoBom)
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            Push-Location "dist/desktop/app"
            try {
              7z a -tzip -mx=9 $zipPath *
              if ($LASTEXITCODE -ne 0) { throw "7z exited with code $LASTEXITCODE" }
            } finally {
              Pop-Location
            }
          } else {
            Compress-Archive -Path "dist/desktop/app/*" -DestinationPath $zipPath -Force
          }
      - uses: actions/upload-artifact@v4
        with:
          name: pigu-windows-x64
          path: pigu-windows-x64.zip
      - name: Attach Windows ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "Pigu ${{ inputs.tag || github.ref_name }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: pigu-windows-x64.zip
