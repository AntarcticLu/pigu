name: Pigu Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.0.1)"
        required: true
        default: "v0.0.1"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            cli_target: darwin-arm64
          - os: macos-14
            target: darwin-x64
            cli_target: darwin-x64-baseline
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install
      - name: Build CLI
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_TARGET: ${{ matrix.cli_target }}
        run: |
          export OPENCODE_VERSION="${GITHUB_REF_NAME#v}"
          cd packages/cli
          bun run script/build.ts --skip-web-ui
      - name: Build & Pack Desktop
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_TARGET: ${{ matrix.target }}
        run: |
          export OPENCODE_VERSION="${GITHUB_REF_NAME#v}"
          cd packages/desktop
          bun run build
          bun run pack
      - name: Assemble macOS Release Archive
        run: |
          mkdir -p release-stage/bin
          tar -xf dist/desktop/opencode-desktop-mac-*.app.tar -C release-stage
          cp packages/cli/dist/cli-${{ matrix.cli_target }}/bin/opencode release-stage/bin/opencode
          cp packages/cli/dist/cli-${{ matrix.cli_target }}/bin/opencode release-stage/bin/pigu
          chmod 755 release-stage/bin/opencode release-stage/bin/pigu
          tar -czf pigu-${{ matrix.target }}.tar.gz -C release-stage .
      - uses: actions/upload-artifact@v4
        with:
          name: pigu-${{ matrix.target }}
          path: pigu-${{ matrix.target }}.tar.gz

  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            cli_target: linux-x64
          - target: linux-arm64
            cli_target: linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install
      - name: Build CLI
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_TARGET: ${{ matrix.cli_target }}
        run: |
          export OPENCODE_VERSION="${GITHUB_REF_NAME#v}"
          cd packages/cli
          bun run script/build.ts
      - name: Assemble Linux Release Archive
        run: |
          mkdir -p release-stage/bin
          cp packages/cli/dist/cli-${{ matrix.cli_target }}/bin/opencode release-stage/bin/opencode
          cp packages/cli/dist/cli-${{ matrix.cli_target }}/bin/opencode release-stage/bin/pigu
          chmod 755 release-stage/bin/opencode release-stage/bin/pigu
          tar -czf pigu-${{ matrix.target }}.tar.gz -C release-stage .
      - uses: actions/upload-artifact@v4
        with:
          name: pigu-${{ matrix.target }}
          path: pigu-${{ matrix.target }}.tar.gz

  build-windows:
    name: Build Windows (windows-x64.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install
      - name: Build CLI
        shell: bash
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_TARGET: windows-x64-baseline
        run: |
          export OPENCODE_VERSION="${GITHUB_REF_NAME#v}"
          cd packages/cli
          bun run script/build.ts --skip-web-ui
      - name: Build & Pack Desktop (Unpacked Portable Dir)
        shell: bash
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_TARGET: windows-x64
        run: |
          export OPENCODE_VERSION="${GITHUB_REF_NAME#v}"
          cd packages/desktop
          bun run build
          bun run pack
      - name: Create Windows Portable ZIP
        shell: pwsh
        run: |
          Copy-Item "packages/cli/dist/cli-windows-x64-baseline/bin/opencode.exe" "dist/desktop/app/pigu.exe" -Force
          Compress-Archive -Path "dist/desktop/app/*" -DestinationPath "pigu-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: pigu-windows-x64
          path: pigu-windows-x64.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Prepare install.sh
        run: cp install artifacts/install.sh
      - name: Publish Release Assets to Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "Pigu ${{ inputs.tag || github.ref_name }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            artifacts/pigu-windows-x64.zip
            artifacts/pigu-darwin-arm64.tar.gz
            artifacts/pigu-darwin-x64.tar.gz
            artifacts/pigu-linux-x64.tar.gz
            artifacts/pigu-linux-arm64.tar.gz
            artifacts/install.sh
